name: Save Hobart flight history

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_flights.py'
      - 'tests/test_flights.py'
      - '.github/workflows/update-flights.yml'

permissions:
  contents: write

# Share the event workflow's group so the two collectors do not push together.
concurrency:
  group: hobart-events-update
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Check flight history handling
        run: python -m unittest discover -s tests -p test_flights.py -v
      - name: Save published flights
        run: python scripts/update_flights.py
      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flights.json
          if ! git diff --cached --quiet; then
            git commit -m "Save Hobart flight history"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
            done
            exit 1
          fi
